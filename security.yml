name: Security Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t security-app ./app

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: security-app
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH